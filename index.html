<!DOCTYPE html>
<html>
  <head>
  <!--Goggle fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
  <!--Goggle fonts-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suhas Agrawal</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <style>
    * {
      margin: 0;
      padding:0;
      }
      body{
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        font-size: 16px;
      }
      header {
        padding: 1rem;
        display: flex;
        gap: 0.5rem;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      #nav{
          
        }
        p {
          font-family: "Smooch Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        font-style: normal;  
        }
        .horizontal-scroll{
          display: flex;
          flex-direction: row;
          overflow-x: scroll;
          height: 80vh;
        }
        .colour-grid{
          display: flex;
          flex-direction: row;
          width: 100vw;
          }
        .colour-grid > * {
          width: calc(100vw * 1/3);
          }
        button {
          animation: fadeIn 0.2s ease-in;
        }
        button:hover {
          background-color: red;
          box-shadow: 5px 5px 11px green ;
        }
        @keyframes fadeIn{
          0%{
            opacity: 0;
            transform: translateY(5px);
          }
          100%{
            opacity: 1;
            transform: translateY(0px);
          }
        }
        #img1{
          background-image: url('/images/image_1.png');
          background-size: cover;
          background-position: center;
        }
        .inner-clr{
          width: 100%;
          height: 100%;
          background-color: yellow;
          display: block;
        }
        .inner-clr:hover{
          display: none;
        }
            
    </style>
  </head>
  <body>
  <header>
  <!-- this is an example of commenting out text in html -->
      <h1>Suhas Agrawal</h1>
      <div id="nav">
        <a href="/about/index.html">About</a>
        <a href="#my-work">My Work</a>
        <a href="https://www.linkedin.com/in/suhas-agrawal/"target="_blank">Externallink</a>
        <a href="mailto:suhas.agrawal86@gmail.com">
          <button>SPAM</button>
        </a>
        <!--<a href="tel:0000000">-->
        <!--  <button>CALL</button>-->
        <!--</a>-->
      </div>
  </header>
  
  <section>
    <h2>Section 1</h2>
    <div class="horizontal-scroll">
    <img src="/images/image_1.png"/>
    <img src="/images/image_2.png"/>
    <img src="/images/image_3.png"/>
    </div>
  </section>
  
  <section id="about-me">
  <h2>About Me</h2>
  <p>
    This is my website about me, I really like trolls can't you see?
  </p>
  </section>
  
  <section id="my-work">
  <h2>My Work</h2>
  <div class="colour-grid">
    <div class="outer-img" id="img1">
      <div class="inner-clr"></div>
    </div>
      <img src="/images/image_2.png"/>
      <img src="/images/image_3.png"/>
    </div>
  </section>
  <script>
    const outerImg = document.querySelector('.outer-img');
    const innerClr = outerImg.querySelector('.inner-clr');
    
    outerImg.addEventListener('mouseenter', () => {
      innerClr.style.display = 'none';
    });
    outerImg.addEventListener('mouseleave', () => {
      innerClr.style.display = 'block';
    });
    
  </script>
  <footer style= "height: 100vh; background-cololr: pink;">
    This is my footer.
  </footer>
  </body>
</html>
