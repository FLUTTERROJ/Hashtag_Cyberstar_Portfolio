<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Suhas - Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Noto Sans', sans-serif;
      color: white;
    }

    body {
      background: #030512;
      overflow: hidden;
      position: relative;
    }

    .background-video {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #030512;
    }

    .background-video::before {
      content: "";
      position: absolute;
      inset: -6%;
      background-image: url("Assets/Home_page.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: imageLoop 18s ease-in-out infinite;
      transform-origin: center;
    }

    .stars {
      position: absolute;
      width: 250%;
      height: 250%;
      left: -75%;
      top: -75%;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, 0.8), transparent 60%),
        radial-gradient(1.2px 1.2px at 35% 70%, rgba(193, 210, 255, 0.85), transparent 65%),
        radial-gradient(1.1px 1.1px at 70% 35%, rgba(255, 255, 255, 0.75), transparent 65%),
        radial-gradient(1.3px 1.3px at 90% 82%, rgba(170, 190, 255, 0.75), transparent 65%),
        radial-gradient(1px 1px at 55% 12%, rgba(255, 255, 255, 0.7), transparent 60%);
      background-size: 420px 420px;
      animation: starDrift 72s linear infinite;
      opacity: 0.52;
      mix-blend-mode: screen;
    }

    .layer-b {
      background-size: 620px 620px;
      opacity: 0.45;
      animation-duration: 110s;
      animation-direction: reverse;
      filter: blur(0.3px);
    }

    .center-beam {
      position: absolute;
      bottom: -6%;
      left: 50%;
      width: min(20vw, 180px);
      height: 74%;
      transform: translateX(-50%);
      clip-path: polygon(0 100%, 100% 100%, 57% 0, 43% 0);
      filter: blur(1px);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .center-beam::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(90, 170, 255, 0.02) 0%,
        rgba(95, 180, 255, 0.18) 36%,
        rgba(115, 205, 255, 0.42) 76%,
        rgba(145, 230, 255, 0.68) 100%
      );
      opacity: 0;
      animation: pathGlow 8.5s ease-in-out infinite;
    }

    .center-beam::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        180deg,
        rgba(170, 235, 255, 0) 0px,
        rgba(170, 235, 255, 0) 18px,
        rgba(200, 245, 255, 0.9) 28px,
        rgba(140, 220, 255, 0.55) 42px,
        rgba(170, 235, 255, 0) 56px
      );
      background-size: 100% 170px;
      background-position: center 240px;
      opacity: 0;
      filter: blur(2px);
      animation: pathStreak 5.8s linear infinite, pathPulse 8.5s ease-in-out infinite;
    }

    .background-video::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(7, 12, 34, 0.12) 0%,
        rgba(5, 8, 24, 0.26) 62%,
        rgba(2, 5, 18, 0.52) 100%
      );
      pointer-events: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
    }

    nav a {
      margin-left: 32px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    nav a:hover {
      color: white;
      text-shadow: 0 0 8px rgba(170, 140, 255, 0.6);
    }

    nav a.active {
      color: white;
    }

    main {
      position: relative;
      z-index: 10;
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    main h1 {
      font-size: clamp(3rem, 5.5vw, 4rem);
      font-weight: 700;
      margin-bottom: 16px;
    }

    .tagline {
      font-size: 1.5rem;
      font-weight: 400;
      color: #e0d9ff;
      margin-bottom: 32px;
    }

    .cta {
      padding: 14px 36px;
      font-weight: 500;
      text-decoration: none;
      color: white;
      border-radius: 6px;
      border: 1px solid rgba(160, 140, 255, 0.5);
      background: rgba(40, 30, 80, 0.6);
      backdrop-filter: blur(4px);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .cta:hover {
      box-shadow: 0 0 20px rgba(160, 140, 255, 0.8);
      transform: translateY(-2px);
    }

    @keyframes starDrift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-4.5%, -3.5%, 0) scale(1.025); }
      100% { transform: translate3d(-9%, -7%, 0) scale(1); }
    }

    @keyframes imageLoop {
      0% {
        transform: scale(1.02) translate3d(0%, 0%, 0);
      }
      25% {
        transform: scale(1.05) translate3d(-1.2%, -0.8%, 0);
      }
      50% {
        transform: scale(1.04) translate3d(-2.2%, -1.5%, 0);
      }
      75% {
        transform: scale(1.06) translate3d(-1.1%, -0.6%, 0);
      }
      100% {
        transform: scale(1.02) translate3d(0%, 0%, 0);
      }
    }

    @keyframes pathGlow {
      0%, 54%, 100% { opacity: 0; }
      62% { opacity: 0.42; }
      70% { opacity: 0.95; }
      80% { opacity: 0; }
    }

    @keyframes pathPulse {
      0%, 54%, 100% { opacity: 0; }
      66% { opacity: 0.95; }
      79% { opacity: 0; }
    }

    @keyframes pathStreak {
      0% { background-position: center 240px; }
      100% { background-position: center -220px; }
    }
  </style>
</head>

<body>
  <div class="background-video" aria-hidden="true">
    <div class="stars layer-a"></div>
    <div class="stars layer-b"></div>
    <div class="center-beam"></div>
  </div>

  <header>
    <div class="logo">SUHAS</div>
    <nav>
      <a class="active" href="#">Project</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">Experiments</a>
    </nav>
  </header>

  <main>
    <h1>Hi, I'm Suhas</h1>
    <p class="tagline">Turning Complexity Into Clarity</p>
    <a href="#" class="cta">View Projects -></a>
  </main>
</body>
</html>
